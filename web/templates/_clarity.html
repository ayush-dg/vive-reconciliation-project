{# Microsoft Clarity (2026-11-04), only when CLARITY_PROJECT_ID is set: who the user is and which page this is, for filtering sessions. #}
{% set clarity_id = clarity_project_id() %}
{% if clarity_id %}
<script type="text/javascript">
  (function(c,l,a,r,i,t,y){
    c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
    t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
    y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
  })(window, document, "clarity", "script", {{ clarity_id | tojson }});
  {% if user_email %}clarity("identify", {{ user_email | tojson }}, null, null, {{ (user_name or user_email) | tojson }});{% endif %}
  clarity("set", "page", {{ (clarity_page or active_page or "unknown") | tojson }});
</script>
{% endif %}
