# Hand-maintained (unlike models/bronze/sources.yml, which
# fabric_dbt_runner.py regenerates per-run) -- these three tables are
# fixed, not one-per-vendor, so there's nothing to discover dynamically.
#
# raw_statement's own header columns (vendor_id, vendor_display_name,
# source_file_name, version_number, ingestion_timestamp, invoice_count,
# extraction_engine) are read directly here -- only its raw_payload column
# is off-limits to SQL (see src/lakehouse/research_unnest.py's docstring).
# unnested_statement_lines/_fields are written by that module.
#
# Moved here from models/silver_silver/sources.yml 2026-09-19 when the
# silver_silver test schema/models were retired -- production
# statement.sql/statement_line.sql have sourced from this dict-dump bronze
# since the 2026-09-18 migration (see their own docstrings).
version: 2
sources:
  - name: research
    database: "{{ env_var('FABRIC_LAKEHOUSE_NAME') }}"
    schema: research_schema
    tables:
      - name: raw_statement
      - name: unnested_statement_lines
      - name: unnested_statement_fields
