name: 'vive_recon'
version: '1.0.0'
config-version: 2

profile: 'vive_recon'

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # known_vendor_ids -- one entry per vendor with a bronze.bronze_<id>_raw
  # table in the Fabric Lakehouse -- is supplied via `dbt run --vars` by
  # src/lakehouse/fabric_dbt_runner.py, which discovers it live from the
  # Lakehouse (see _discover_known_vendor_ids() there) rather than reading
  # a hand-maintained list. Nothing needs editing here when a vendor is
  # renamed or onboarded. This empty default only applies to a manual
  # `dbt run` invoked outside that path.
  known_vendor_ids: []

models:
  vive_recon:
    silver:
      +materialized: incremental
      +incremental_strategy: merge
      # unique_key is set per-model (statement.sql, statement_line.sql) --
      # merge upserts by that key so a re-run of the same statement_id
      # doesn't duplicate rows, matching the app's existing
      # DELETE-then-INSERT idempotency pattern for Bronze/Silver writes.
      # No +schema override -- profiles.yml's default `schema: silver`
      # already targets the right place.
      #
      # statement.sql/statement_line.sql source from bronze.raw_statement
      # (the dict-dump) + unnested_statement_lines/_fields, not from the
      # old per-vendor bronze.bronze_<vendor_id>_raw tables -- migrated
      # 2026-09-18 from the old per-vendor-typed-bronze design (see their
      # own docstrings for the full history and the schema-parity notes
      # vs. the old bronze-driven version). This used to be developed and
      # validated in a separate silver_silver/ test schema before the
      # 2026-09-18 cutover; that scaffolding (models/silver_silver/,
      # src/matching/silver_silver_matching.py) was retired 2026-09-19
      # once production matching (src/matching/fabric_matching.py) had
      # everything it validated ported over -- see git history if any of
      # that context is needed again.

seeds:
  vive_recon:
    vendor_normalization_rule:
      # dbt's column-type inference guesses from CSV values -- every row's
      # effective_end is blank, so it inferred `int` instead of `date`,
      # confirmed 2026-09-17 to break a real date comparison
      # ("date is incompatible with int") the moment a query does
      # `effective_end >= some_date`. Declared explicitly instead of
      # relying on inference for exactly the columns that are all-NULL
      # today but need a real type for when they're populated.
      +column_types:
        effective_start: date
        effective_end: date
        is_active: bit
    vendor_line_selection_rule:
      +column_types:
        effective_start: date
        effective_end: date
        is_active: bit
