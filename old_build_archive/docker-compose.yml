services:
  app:
    build: .
    env_file:
      # Must exist locally (copy .env.example to .env and fill in keys).
      # Never baked into the image — read at container start only.
      - .env
    volumes:
      # SQLite lakehouse persists across image rebuilds/container recreation.
      - ./lakehouse:/app/lakehouse
      # Input PDFs — add/remove files on the host without rebuilding the image.
      - ./sample_data:/app/sample_data
    stdin_open: true
    tty: true
